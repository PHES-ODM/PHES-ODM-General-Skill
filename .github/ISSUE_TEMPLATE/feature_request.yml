name: Feature request
description: Suggest a new capability or workflow for the skill.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The ODM task you want help with that the skill handles badly or not at all.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should the skill do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried already
