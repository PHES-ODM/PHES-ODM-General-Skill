name: Incorrect ODM guidance
description: The skill said something about the ODM that is wrong or misleading.
labels: ["bug", "accuracy"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most valuable report for this repository. Wrong ODM
        identifiers and wrong table guidance are hard to spot and get repeated
        downstream, so please include the exact wording the skill used.
  - type: textarea
    id: prompt
    attributes:
      label: What you asked
      description: The prompt or slash command you gave Claude.
      render: text
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: What the skill said
      description: Paste the incorrect part of the answer verbatim.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should have said
      description: >
        The correct table, column, enumeration value, or command — and, if you
        have it, the source that confirms it (MCP result, schema line, docs
        page).
    validations:
      required: true
  - type: input
    id: odm-version
    attributes:
      label: ODM version
      placeholder: "3.0.1"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Skill version, and whether the phes-odm-search MCP, odm-validate, and
        odm-map were installed and reachable.
